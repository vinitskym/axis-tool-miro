<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>AXIS TOOL</title>
    <!-- Miro Web SDK v2 -->
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  </head>
  <body>
    <script>
      // נקודת הכניסה של האפליקציה: לחיצה על האייקון ב-Miro פותחת את הפאנל
      async function init() {
        miro.board.ui.on("icon:click", async () => {
          await miro.board.ui.openPanel({ url: "app.html" });
        });
      }
      init();
    </script>
  </body>
</html>
